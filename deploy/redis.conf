bind 0.0.0.0
# This is safe only while compose.yaml keeps port 6379 unpublished on the
# project network. If Redis is exposed outside that network, enable protected
# mode and configure authentication before deployment.
protected-mode no
port 6379
appendonly no
save ""
maxmemory 512mb
maxmemory-policy allkeys-lfu
tcp-keepalive 300
timeout 0
