name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test, vet, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -timeout=15m ./...

      - name: Install race detector compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -timeout=20m ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l $(go list -f '{{.Dir}}' ./...))"
          if [ -n "$unformatted" ]; then
            printf 'gofmt needs to run on these paths:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Build all packages
        run: go build ./...

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: moviepilot_test
          POSTGRES_USER: moviepilot
          POSTGRES_PASSWORD: moviepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U moviepilot -d moviepilot_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run PostgreSQL integration tests
        env:
          MOVIEPILOT_TEST_DATABASE_URL: postgres://moviepilot:moviepilot@127.0.0.1:5432/moviepilot_test?sslmode=disable
        run: go test -tags=integration -timeout=15m ./internal/database ./internal/downloadflow ./internal/organizationflow

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: moviepilot-go:ci-${{ github.sha }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
